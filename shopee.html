<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>溫家堡 蝦皮好物分潤推薦</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://raw.githubusercontent.com/wencastlewinston/lineage-Simulator/main/1774111559586.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/wencastlewinston/lineage-Simulator/main/1774111559586.png">
    <meta name="theme-color" content="#ee4d2d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="search-ui.css">
    <link rel="stylesheet" href="yt-player.css">
    <link rel="stylesheet" href="components.css">
</head>
<body>
    <div class="rainbow-line"></div>
    
    <div class="header-fixed"></div>

    <div class="main-content" id="mainWrapper">
        <div class="brand-banner fade-in"></div>

        <div class="search-container">
            <div class="search-bar-row">
                <input type="text" id="searchInput" onkeyup="if(window.searchTable) searchTable()" placeholder="🔍 搜尋蝦皮好物...">
                
                <a href="https://www.facebook.com/share/1EQ3BSyzmy/" target="_blank" class="icon-btn">
                    <i class="fab fa-facebook-f fb-ic"></i>
                </a>
                
                <a href="https://www.youtube.com/@WenCastle" target="_blank" class="icon-btn">
                    <i class="fab fa-youtube yt-ic"></i>
                </a>
            </div>
            
            <div class="tool-bar" id="category-tool-bar">
                <div class="tag active category-tag" onclick="filterData('', this, 'category')">全部商品</div>
            </div>

            <div class="stat-row">
                <div class="stat-item-small">精選好物 <b><span id="stat-total">0</span></b> 件</div>
            </div>
        </div>

        <div id="productBody" class="product-grid"></div>

        <div class="footer">
            <div class="footer-big">溫士頓嚴選 蝦皮好物推薦 🏠</div>
            <div class="footer-mid">分享優質好物與美好生活</div>
            <div class="footer-small">溫家堡 WenCastle ⓒ 2021-2026</div>
        </div>
    </div>

    <div id="goTopBtn" onclick="window.scrollTo(0,0)">↑</div>

    <script src="config.js"></script>
    <script src="yt-player.js"></script>
    <script src="ui-utils.js"></script>
    <script src="main.js"></script>
</body>
</html>
