<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好物推薦｜蝦皮分潤導購</title>
    <style>
        :root {
            --primary-color: #ee4d2d; /* 蝦皮橘紅 */
            --primary-hover: #d73211;
            --bg-color: #f5f5f5;
            --text-color: #333;
            --card-bg: #fff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* 搜尋與分類導覽 */
        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (min-width: 768px) {
            .filter-section {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .category-buttons {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .cat-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 商品網格 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 正方形比例 */
            background-color: #eee;
        }

        .product-img-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.8em;
        }

        .product-price-row {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 1rem;
            margin-top: auto;
        }

        .product-price {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: bold;
        }

        .product-original-price {
            color: #999;
            font-size: 0.85rem;
            text-decoration: line-through;
        }

        .buy-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 0.75rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .buy-btn:hover {
            background-color: var(--primary-hover);
        }

        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: #777;
        }
    </style>
</head>
<body>

    <header>
        <h1>精選好物特輯</h1>
        <p>嚴選蝦皮高CP值商品，幫你省時又省錢！</p>
    </header>

    <div class="container">
        <!-- 搜尋與分類 -->
        <div class="filter-section">
            <div class="category-buttons" id="categoryContainer">
                <button class="cat-btn active" data-category="all">全部商品</button>
                <button class="cat-btn" data-category="3C">3C家電</button>
                <button class="cat-btn" data-category="生活">生活居家</button>
                <button class="cat-btn" data-category="戶外">戶外露營</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜尋商品名稱...">
            </div>
        </div>

        <!-- 商品列表容器 -->
        <div class="product-grid" id="productGrid">
            <!-- 動態渲染商品會出現在這 -->
        </div>
    </div>

    <script>
        // 模擬商品資料庫（之後你可以改成從 JSON 或後台讀取，並填入你的蝦皮分潤連結 affiliateUrl）
        const products = [
            {
                id: 1,
                name: "【台灣現貨】多功能無線藍牙自拍棒 三腳架 補光燈 直播神器",
                price: 299,
                originalPrice: 599,
                category: "3C",
                image: "https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=500&auto=format&fit=crop&q=60",
                affiliateUrl: "https://shope.ee/your-affiliate-link-1" // 替換成你的蝦皮分潤連結
            },
            {
                id: 2,
                name: "北歐風簡約大容量保溫壺 玻璃內膽 家用暖水瓶 咖啡壺",
                price: 450,
                originalPrice: 899,
                category: "生活",
                image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=60",
                affiliateUrl: "https://shope.ee/your-affiliate-link-2"
            },
            {
                id: 3,
                name: "超輕量鋁合金折疊椅 戶外露營椅 釣魚椅 附收納袋",
                price: 380,
                originalPrice: 680,
                category: "戶外",
                image: "https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=500&auto=format&fit=crop&q=60",
                affiliateUrl: "https://shope.ee/your-affiliate-link-3"
            },
            {
                id: 4,
                name: "Type-C 快速充電線 編織耐拉扯手機傳輸線 支援快充",
                price: 99,
                originalPrice: 250,
                category: "3C",
                image: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=500&auto=format&fit=crop&q=60",
                affiliateUrl: "https://shope.ee/your-affiliate-link-4"
            }
        ];

        const productGrid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryContainer = document.getElementById('categoryContainer');

        let currentCategory = 'all';
        let searchQuery = '';

        // 渲染商品函式
        function renderProducts() {
            // 篩選邏輯
            const filtered = products.filter(item => {
                const matchCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            // 無結果顯示
            if (filtered.length === 0) {
                productGrid.innerHTML = `<div class="no-result">沒有找到相關的商品喔！</div>`;
                return;
            }

            // 組裝 HTML
            productGrid.innerHTML = filtered.map(item => `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <img src="${item.image}" alt="${item.name}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${item.name}</div>
                        <div class="product-price-row">
                            <span class="product-price">NT$${item.price}</span>
                            <span class="product-original-price">NT$${item.originalPrice}</span>
                        </div>
                        <a href="${item.affiliateUrl}" target="_blank" rel="noopener noreferrer" class="buy-btn">立即搶購</a>
                    </div>
                </div>
            `).join('');
        }

        // 監聽分類按鈕點擊
        categoryContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('cat-btn')) {
                // 移除其他按鈕的 active
                document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                // 加上當前按鈕的 active
                e.target.classList.add('active');
                
                currentCategory = e.target.getAttribute('data-category');
                renderProducts();
            }
        });

        // 監聽搜尋框輸入
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderProducts();
        });

        // 初始渲染
        renderProducts();
    </script>
</body>
</html>
